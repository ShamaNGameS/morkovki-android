import java.net.URI

plugins {
    id 'com.android.application'
}

def defaultSiteUrl = 'https://morkovki-online-test-23oct.loca.lt/'
def configuredSiteUrl = providers.gradleProperty('siteUrl').orElse(defaultSiteUrl).get().trim()
def parsedSiteUrl
try {
    parsedSiteUrl = new URI(configuredSiteUrl)
} catch (Exception exception) {
    throw new GradleException("Invalid -PsiteUrl value: ${configuredSiteUrl}", exception)
}
if (!'https'.equalsIgnoreCase(parsedSiteUrl.scheme)
        || !parsedSiteUrl.host
        || parsedSiteUrl.rawUserInfo
        || parsedSiteUrl.query
        || parsedSiteUrl.fragment
        || (parsedSiteUrl.path && parsedSiteUrl.path != '/')) {
    throw new GradleException('siteUrl must be an HTTPS origin, for example https://chat.example.com/')
}
def siteUrl = "https://${parsedSiteUrl.rawAuthority}/"
def escapedSiteUrl = siteUrl.replace('\\', '\\\\').replace('"', '\\"')
def localDebugKeystore = rootProject.file('signing/android-debug.keystore')
def hasLocalDebugKeystore = localDebugKeystore.isFile()

android {
    namespace 'ru.morkovki.chat'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'ru.morkovki.chat'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '1.8.0'
        buildConfigField 'String', 'SITE_URL', "\"${escapedSiteUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasLocalDebugKeystore) {
            localDebug {
                storeFile localDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (hasLocalDebugKeystore) {
                signingConfig signingConfigs.localDebug
            }
        }
    }}
dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}
