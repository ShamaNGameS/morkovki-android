name: Android APK - Direct HTTPS IP
on:
  workflow_dispatch:
    inputs:
      server_origin:
        description: 'Direct HTTPS IPv4 origin (valid IP certificate required)'
        required: true
        default: 'https://212.220.99.132/'
        type: string
permissions:
  contents: read
jobs:
  direct-ip-apk:
    name: Verify secure IP endpoint and build test APK
    runs-on: ubuntu-latest
    env:
      DIRECT_IP_ORIGIN: ${{ inputs.server_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate public HTTPS IPv4 origin
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress, os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ['DIRECT_IP_ORIGIN'])
          try:
              address = ipaddress.IPv4Address(url.hostname or '')
          except ipaddress.AddressValueError as exc:
              raise SystemExit(f'Invalid IPv4 origin: {exc}')
          if (url.scheme != 'https' or not address.is_global or url.username
                  or url.password or url.query or url.fragment or url.path != '/' or url.port == 80):
              raise SystemExit('Require public IPv4 HTTPS origin, e.g. https://212.220.99.132/')
          print('Public HTTPS IPv4 origin validated')
          PY
      - name: Test direct IP authentication preflight locally
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify live direct HTTPS auth routes (read-only)
        run: python3 scripts/check_direct_ip_auth.py --origin "$DIRECT_IP_ORIGIN"
      - name: Validate Android scripts
        run: |
          node --check app/src/main/assets/mobile-ux-v188.js
          node --check app/src/main/assets/android-ui.js
          node --check app/src/main/assets/friends-mobile-fix.js
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable Android signing key (optional)
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.MORKOVKI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            mkdir -p signing
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > signing/android-debug.keystore
            chmod 600 signing/android-debug.keystore
          else
            echo "::warning::No stable signing secret; APK may not update the installed app."
          fi
      - name: Build Direct IP HTTPS APK
        run: ./gradlew --no-daemon assembleDebug "-PsiteUrl=${DIRECT_IP_ORIGIN}" "-PdirectIpOnly=true"
      - name: Report APK signing fingerprint
        run: ./gradlew --no-daemon signingReport "-PsiteUrl=${DIRECT_IP_ORIGIN}" "-PdirectIpOnly=true"
      - name: Package direct IP APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/Morkovki-Direct-IP.apk
          test -s upload/Morkovki-Direct-IP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Morkovki-Direct-IP-APK
          path: upload/Morkovki-Direct-IP.apk
          if-no-files-found: error
