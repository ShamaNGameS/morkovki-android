name: Android APK - Google HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  google-https-apk:
    name: Build Google HTTPS test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "Cannot find sdkmanager"; exit 1; }
          echo "Using SDK manager: $SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble Google HTTPS APK
        run: ./gradlew --no-daemon assembleDebug "-PsiteUrl=https://morkovkionline.ru/"
      - uses: actions/upload-artifact@v4
        with:
          name: Morkovki-Google-HTTPS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
